name: Release

# Publishing is triggered by pushing a version tag — `v0.1.0-alpha.2` — made by
# `node scripts/version.ts 0.1.0-alpha.2` (see RELEASING.md). Nothing else
# publishes, and a tag that disagrees with the package versions is refused.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Every CI gate, unchanged. A release is a commit that already passed them.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # A GitHub environment with required reviewers: a human approves every
    # release, which is the one control that stops a compromised dependency in
    # the build from shipping one.
    environment: npm-publish
    permissions:
      contents: write     # the GitHub release
      id-token: write     # npm trusted publishing (OIDC) and provenance
    steps:
      # Pinned to commits rather than tags: this job holds an identity npm
      # accepts as the publisher, and a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache:` — nothing another run wrote into the Actions cache gets
      # into the job that publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and Node 22 bundles npm 10. An
      # exact version rather than a range, for the reason the actions are
      # pinned: a range installs whatever npm was released that morning.
      - run: npm install -g npm@11.19.1

      - run: npm ci
      - run: npm run typecheck

      - name: Tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node scripts/check-release.ts "$tag"

      - name: Packaging is clean (what actually ships)
        run: node scripts/check-pack.ts

      # A prerelease must never land on `latest`: `npm install @erenthedeveloper0/zen`
      # would then install a pre-alpha for anyone who did not ask for one, and
      # there is no undo.
      - name: Derive the dist-tag from the version
        id: tag
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          case "$v" in
            *-alpha*) echo "dist=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta*)  echo "dist=beta"  >> "$GITHUB_OUTPUT" ;;
            *-rc*)    echo "dist=next"  >> "$GITHUB_OUTPUT" ;;
            *-*)      echo "::error::unrecognised prerelease $v"; exit 1 ;;
            *)        echo "dist=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Dependency order, one at a time: the internal pins are exact, so a
      # package whose dependency is not yet on the registry installs broken.
      # A version already published is skipped, so a run that failed half way
      # can simply be re-run.
      - name: Publish, in dependency order
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist }}
          # Empty on purpose. The only credential this job has is the
          # short-lived one npm's trusted publishing exchanges for this run's
          # OIDC identity; no long-lived token is read from anywhere. Set here
          # so setup-node's placeholder is not sent with the `npm view` calls.
          NODE_AUTH_TOKEN: ''
        run: |
          for dir in core router adapter-node openapi middleware zen; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "── $name@$version already published, skipping"
              continue
            fi
            echo "── publishing $name@$version (tag $DIST_TAG)"
            if ! npm publish --workspace "packages/$dir" --tag "$DIST_TAG" --provenance --access public; then
              # What 0.1.0-alpha.2's first run did, with nothing on the page to
              # say why: without a trusted publisher npm has no credential,
              # and the error above is ENEEDAUTH, E401 or E404.
              echo "::error title=npm refused $name@$version::Check that $name has a trusted publisher for this repository, workflow release.yml and environment npm-publish, allowed to publish (npm trust list $name) — RELEASING.md, One-time setup. Packages before it in the order are published; re-run this job once it is fixed and they are skipped."
              exit 1
            fi
            # The registry's read replicas lag a few seconds behind a publish;
            # the next package depends on this one.
            for i in $(seq 1 30); do
              npm view "$name@$version" version >/dev/null 2>&1 && break
              sleep 2
            done
          done

      # The release page is this version's CHANGELOG section — what changed, not
      # a link to go and find it — under the install line, with relative links
      # made absolute, since on /releases/ they would resolve to nothing.
      # check-release.ts has already refused a missing or undated entry.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./packages/zen/package.json').name")
          {
            printf '```bash\nnpm install %s@%s\n```\n' "$name" "$version"
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
              on { print }
            ' CHANGELOG.md \
              | sed "s#](\./#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/#g"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # A re-run after the release was created would otherwise fail here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "── the release for $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          fi
