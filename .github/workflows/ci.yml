name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs every gate below before it publishes anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both LTS lines and the current release. Node >= 22.18 runs the
        # TypeScript sources directly (type stripping unflagged); `22.x`
        # resolves to the newest 22, which is what contributors have.
        node: ['22.x', '24.x', '26.x']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Builds every package, then type-checks the examples against the built
      # declarations. An example that does not compile is worse than no
      # example, and this is how one stayed broken (§8.2.1).
      - name: Typecheck & build
        run: npm run typecheck

      # ~1,250 tests: unit, integration, differential (compiled ≡ interpreted —
      # random hook plans crossed with random middleware chains, and random
      # chains where the deadline blows at a random position, which must agree
      # on *which* boundary abandoned the request), type-level, the
      # monomorphism assertion (I2, §20.7), and the §29.1 drift check:
      # documented response fields must equal the fields the compiled
      # serializer actually emits, and 11.4's coercion fuzzer, which asserts
      # three things beyond compiled-equals-interpreted: coercing twice equals
      # coercing once, no key is invented, and a position whose schema accepts
      # a string is never converted. §16's config suite has no differential twin
      # and should not — it compiles nothing — so its fuzzer is a *property*
      # suite over random layer stacks: the fold is total, deterministic,
      # invents no path, freezes to the leaves, and never lets a secret reach a
      # projection. It is the suite that caught the scalar/branch collision that
      # the hand-written test passed against.
      #
      # Two suites are about the framework rather than a feature: §20.7's
      # leaks.test.ts — a real port served and closed with nothing left open,
      # and 500 interleaved requests that never read one another's state — and
      # the generated-source snapshot, every unit the compilers emit for one
      # fixture application, so a compiler change arrives in review as a diff
      # of code instead of a suite that still passes.
      - name: Test
        run: npm test

      # The Node adapter's own suite runs inside `npm test` above, over real
      # sockets: a request body must not abort ctx.signal, a client leaving
      # mid-stream must not crash the process, a missing file is a 404 rather
      # than a dropped connection, and shutdown does not wait on idle
      # keep-alive connections. None of those is visible to inject().

      # Real sockets, real HTTP — proves the adapter and wire format, which
      # inject() deliberately bypasses. Includes the §13.3 leak check (a route
      # whose handler returns a passwordHash must not put it on the wire), the
      # §29.2 endpoints including that the viewer makes no external request, the
      # §9.4 stage-10 contract (`onResponse` runs after the adapter has flushed,
      # so a real socket is the only place it is honestly under test), §4.4:
      # a handler that never returns must give its *socket* back on time, which
      # is a claim only a real connection can falsify, and §4.5 step 1: readiness
      # must report `draining` while the server is still accepting — which needs
      # an open socket and a shutting-down process at the same moment, and was
      # running in the wrong order for as long as nothing could ask.
      - name: Smoke test
        run: node scripts/smoke.ts

      # §29.7 — the generated document is diffed against the committed baseline
      # and a breaking change fails the build. An API change should be reviewed
      # as an API change, not as a diff in a routes file.
      - name: API compatibility gate
        run: npm run openapi:check

      # Every "Working today" bullet in the README and every "Status: built"
      # block in ARCHITECTURE.md carries an id, and each id is a probe against
      # the built packages. The job fails when a claim stops holding, when a
      # sentence has no probe, and when a gap the docs admit closes — a fixed
      # defect must stop being described as missing. Two audits wrote these
      # probes by hand and found every one failing; this is the same check,
      # run by the build instead of by the next audit.
      - name: Claims ledger
        run: node scripts/claims.ts

  type-performance:
    name: type-check performance gate (M2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # §28.2 — a type-level performance regression is as user-visible as a
      # runtime one and is normally noticed far too late. Numbers are printed on
      # every run so the trend is inspectable, not just the pass/fail.
      - name: Type-check performance matrix
        run: node benchmarks/typecheck/run.ts

      # §13.3.2 — the serializer benchmark asserts byte-equality with
      # JSON.stringify and between the two engines *before* it times anything,
      # so a "win" produced by emitting something different fails the job rather
      # than printing a good number.
      - name: Serializer throughput
        run: node benchmarks/serializer/run.ts

      - name: String-escape crossover
        run: node benchmarks/serializer/escape.ts

      # §29.8 — generation cost at 100/250/500 routes, what $ref dedup saves,
      # and the assertion that matters most: registering the OpenAPI plugin must
      # not change per-request cost beyond the measurement noise. The document is
      # built once, at boot; a regression here means something started running
      # per request.
      - name: OpenAPI generation cost
        run: node benchmarks/openapi/run.ts

      # §9.4 — the claim is that a phase you do not use costs nothing, and the
      # step that enforces it is not the timing: the benchmark fails the job if
      # the generated pipeline for a hookless route stops being *byte identical*
      # to one compiled in an app with eight phases registered elsewhere. It
      # also fails if hooks and phase middleware stop compiling to the same call
      # site, which is what makes "pick whichever fits the concern" true.
      - name: Hook system cost
        run: node benchmarks/hooks/run.ts

      # §4.4 — the same discipline for deadlines, and it gates in both
      # directions. The job fails if a route that declared no timeout stops
      # being byte-identical to one compiled in an app that never heard of the
      # feature; and it fails if a route that *did* declare one stops emitting
      # every §4.1 stage boundary, because losing a boundary would remove
      # cancellation silently — the arm would still answer on time and the
      # abandoned request would simply keep working behind it.
      - name: Deadline cost
        run: node benchmarks/deadlines/run.ts

      # §31.4 — three gates, and only the first is the familiar zero-cost one.
      # The job fails if registering the health plugin changes an application
      # route's generated pipeline by a byte; if a stampede of simultaneous
      # polls produces more than one probe, because collapsing them is the
      # whole feature and it protects the component least able to absorb load
      # at the exact moment it is least able to; and if a wedged dependency
      # escapes its own budget or hides a healthy sibling's answer, which is
      # the failure that takes hand-written health endpoints down.
      - name: Health & readiness cost
        run: node benchmarks/health/run.ts

      # 11.4 — two gates, and the second is a correctness one that lives in a
      # benchmark on purpose. The job fails if a route whose schema declares
      # only strings stops compiling to a byte-identical pipeline or starts
      # emitting a coercer; and it fails if a declared string is ever converted,
      # because "?zip=01234 becomes 1234" is the failure this design exists to
      # make impossible and it is exactly the property a later optimisation
      # would be tempted to trade for a faster path.
      - name: Coercion cost
        run: node benchmarks/coercion/run.ts

      # §16 — two gates, and the second is a security one that lives in a
      # benchmark for the same reason §11.4's does: it is the property a later
      # optimisation would be most tempted to trade away, because building the
      # snapshot twice (once with secrets, once without) is the obvious way to
      # make `explainConfig` cheaper. The job fails if a route that never reads
      # configuration stops compiling to a byte-identical pipeline *or a
      # byte-identical context class* — the second is the one that matters,
      # because it is what stops `ctx.config` from becoming a field on the
      # context — and it fails if a secret reaches the AppGraph snapshot,
      # `explainConfig`, or `JSON.stringify(app.config)`.
      - name: Configuration cost
        run: node benchmarks/config/run.ts

      # §32 — two gates, and the second is a security one, in a benchmark for
      # the same reason §11.4's and §16's are: it is the property a later
      # optimisation is most tempted to trade away. The job fails if importing
      # the middleware pack changes the generated pipeline of a route that does
      # not use it; and it fails if an origin outside the allowlist is ever
      # reflected, under any of six shapes of allowlist crossed with eight
      # hostile origins. Reflecting whatever arrives is the fastest possible
      # CORS, which is exactly why it needs a gate rather than a test.
      #
      # It also fails if the rate limiter's store retains a window that has
      # ended, or takes more than a millisecond to release one — a limiter
      # keyed on something the client chooses is a memory DoS unless eviction
      # is O(1), and a sweep under load is the failure that looks like a leak.
      - name: Middleware pack cost
        run: node benchmarks/middleware/run.ts

      # §13.4 — three gates, and the middle one is the security gate this
      # subsystem needs. The job fails if a route that declares one
      # representation stops compiling to a byte-identical pipeline or starts
      # emitting a negotiation step; if a representation the client explicitly
      # refused with `q=0` is ever served, over five shapes of offer list
      # crossed with eight hostile Accept headers; and if the per-route Accept
      # cache stops being bounded or starts answering incorrectly once full.
      #
      # The refusal gate is the important one and it is subtle in a way a test
      # is not built to catch. Scoring an offer by the *highest* q among the
      # ranges that match it — rather than by the most specific one, which is
      # what RFC 9110 §12.5.1 requires — is both the obvious implementation and
      # the faster one, and it silently serves the single format the client
      # named and refused. It is the same class of shortcut as reflecting an
      # origin, so it gets the same class of gate.
      - name: Content negotiation cost
        run: node benchmarks/negotiation/run.ts

      # §28.8 — the refusal path. A 404 used to cost ~10× a served request,
      # almost all of it the stack of an Error nobody would read: a free
      # amplification factor for the cheapest hostile traffic there is. The job
      # fails if a refusal the framework makes (404, 405, 406) captures a stack
      # again, or if an error an application throws stops keeping its own.
      - name: Refusal cost
        run: node benchmarks/refusals/run.ts

      # The pre-release audit's fixes on the request path, gated on what is
      # emitted rather than on a timing: a route without `around` stays
      # byte-identical beside one with it, `next()` gains its promise only where
      # the downstream compiled synchronous, an absolute-form target routes like
      # the origin form, and a request with nothing to release queues nothing.
      #
      # And 0.1.0-alpha.5's hot path: a plain-arrow handler compiles with no
      # `async` and no `await` (§8.4), a clean JSON body is parsed with no
      # reviver and a served match builds no `Set` — structural, all three —
      # and the one timing gate in this job: clean JSON intake against
      # 0.1.0-alpha.4's parser, at most 1.5× a bare decode-and-parse everywhere
      # and 5× faster wherever the runtime's reviver makes 5× reachable.
      - name: Request path cost
        run: node benchmarks/request-path/run.ts

      # §19.5 — three gates, and the first two are security gates living in a
      # benchmark for the reason §11.4's and §32.3's are: the unsafe version of
      # each is the faster one. The job fails if a hostile value escapes its
      # hole in any of seven positions — judged by the WHATWG URL parser and a
      # grammar for escaped text, not by the code under test — if a hostile
      # redirect reaches an origin its policy does not name, under an http page
      # or an https one; and if configuring a redirect policy changes a byte of
      # generated code, which is what keeps it off the request path.
      - name: Injection defences cost
        run: node benchmarks/injection/run.ts

      # §5.7 — two gates, and the first is the property URL generation exists
      # for: every link `app.url()` returns, put through the WHATWG parser the
      # way a browser treats an `href` and sent to the app, must reach the route
      # it names with the values it was built from — across a table of routes
      # that outrank one another and values chosen to break a hand-built path.
      # The shortcut a later optimisation would take is skipping the router
      # check, and that is the faster version, so it is gated here. The second
      # fails if naming or linking a route changes a byte of generated code.
      - name: URL generation cost
        run: node benchmarks/url/run.ts

      # CONTRIBUTING.md convention 3 — "a test that passes against the bug is not a
      # test". A hundred and forty-four known defects are patched into the
      # source one at a time; each must make its named suite fail — or, for
      # the strata, regex and claims checks, its script. A control that *passes*
      # means the assertion it points at is not load-bearing, and the job fails.
      #
      # It caught three things on its first run, which is why it is a script and
      # a CI step rather than something each pass does by hand: a property
      # fuzzer whose generator never produced the input one of its own branches
      # existed for, an assertion aimed at a code path that could not reach the
      # behaviour it claimed to cover, and a control whose patch did not compile
      # (which reads exactly like a passing control unless something checks).
      # The audit pass that added seventeen more found a fourth: a test that
      # probed for a free port with the very call it was testing, so the bug
      # and the probe agreed and the test passed against the defect.
      - name: Negative controls
        run: node scripts/negative-controls.ts

  competitors:
    name: competitor benchmark harness (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/competitors/package-lock.json
      - run: npm ci
      - run: npm run typecheck

      # §1.4's falsifiable prediction is tested against node:http, Fastify, Hono
      # and Express by `benchmarks/competitors`, which is its own npm project
      # with its own lockfile — not a workspace, so the frameworks it compares
      # against never enter the install the release job publishes from. Shared
      # runners are too noisy to time it; this proves the harness still works:
      # every server answers every workload correctly, and a one-second run of
      # each completes with no error and no non-2xx response.
      - run: npm ci --prefix benchmarks/competitors --ignore-scripts
      - name: Competitor harness smoke
        run: node benchmarks/competitors/run.ts --smoke

  packaging:
    name: packages install and run from their tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # The workspace resolves every package through
      # symlinks and never packs, so nothing else here sees a tarball: no build
      # cache with absolute paths, no source map without its source, README and
      # LICENSE present — then all six tarballs installed in a scratch project
      # outside the workspace, serving a real request, and a consumer
      # type-checked against the published declarations on the oldest
      # TypeScript the manifests declare.
      - name: Pack, install, run, type-check on TypeScript 5.0
        run: node scripts/check-pack.ts --typescript 5.0

  zero-dependencies:
    name: '@erenthedeveloper0/zen-core has zero runtime dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      # §19.8 — "zero runtime dependencies" is a CI check, not a slogan.
      - name: Assert core dependency set is empty
        run: |
          deps=$(node -p "JSON.stringify(require('./packages/core/package.json').dependencies || {})")
          echo "core dependencies: $deps"
          test "$deps" = "{}" || { echo "::error::@erenthedeveloper0/zen-core gained a runtime dependency: $deps"; exit 1; }

      # Every import form — static, type-only, side-effect, re-export, the tail
      # of a multi-line import, dynamic import() and require() — and no
      # comment line: dotenv.ts documents the host's half of its seam with a
      # `node:fs` example, and the first version of this grep failed on it.
      - name: "Assert core imports nothing from node:"
        run: |
          if grep -rnE "(from|import|require)[[:space:]]*\(?[[:space:]]*['\"]node:" packages/core/src \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//)'; then
            echo "::error::@erenthedeveloper0/zen-core must not import platform APIs — that is the adapter's job (§3.3 B2)"
            exit 1
          fi

      # §3.1 — no module in core imports from a higher stratum. Reads import
      # specifiers and needs nothing installed; the upward edges that are the
      # design (compilers calling their interpreted twins' helpers) are listed
      # in the script with their reasons, and a listed edge that disappears
      # fails too, so the list cannot outlive the code it excuses.
      - name: Assert core's strata point down (§3.1)
        run: node scripts/check-strata.ts

      # §24.3 — the dependency graph has no cycles and openapi is a leaf on core.
      # Depending on the router would be the shortest way to reach param-type
      # schemas, and the one where the two copies of that table drift (§5.2).
      - name: Assert @erenthedeveloper0/zen-openapi depends on core alone
        run: |
          deps=$(node -p "Object.keys(require('./packages/openapi/package.json').dependencies || {}).join(',')")
          echo "openapi dependencies: $deps"
          test "$deps" = "@erenthedeveloper0/zen-core" || { echo "::error::@erenthedeveloper0/zen-openapi must depend on @erenthedeveloper0/zen-core alone, got: $deps"; exit 1; }

      # §19.3 — no regex in framework source can backtrack without bound. The
      # one step here that needs an install: TypeScript's parser is what tells
      # a regex literal from a division, which is the difference between a
      # lint and a grep that misses half of them.
      - run: npm ci
      - name: Assert no regex in framework source can backtrack (§19.3)
        run: node scripts/check-regex.ts
