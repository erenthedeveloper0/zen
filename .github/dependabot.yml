version: 2
updates:
  # The workflows pin actions by major version; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dev-only: typescript, @types/node, and zod for the examples. The published
  # packages have no third-party runtime dependencies to update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The six packages pin each other exactly and move in lockstep through
    # `scripts/version.ts` (RELEASING.md). A bot bumping one pin would publish
    # a set that disagrees with itself, which `check-release.ts` then refuses.
    ignore:
      - dependency-name: '@erenthedeveloper0/*'
      # @types/node tracks the oldest Node the packages support (engines:
      # >= 22.6); a newer major would let code type-check against APIs Node 22
      # does not have. A TypeScript major changes the build itself — 7.0 stopped
      # loading @types packages by default, and core's standard globals (URL,
      # AbortSignal, TextEncoder, performance) went with them — so it is a
      # migration to make on purpose, not a weekly bump.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns: ['*']
